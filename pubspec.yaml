name: talagasari_hub
description: Platform Komunitas Terpadu Desa Talagasari - Informasi Warga & Layanan Jasa Berbasis Lokasi.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase Core
  firebase_core: ^2.24.0
  firebase_auth: ^4.15.0
  cloud_firestore: ^4.13.0

  # State Management
  get: ^4.6.6

  # Location & GPS
  geolocator: ^10.1.0
  permission_handler: ^11.1.0
  flutter_map: ^7.0.2      # peta OpenStreetMap (gratis, tanpa API key)
  latlong2: ^0.9.1

  # Image
  image_picker: ^1.0.5
  camera: ^0.10.5+9        # kamera in-app (verifikasi identitas, dengan garis panduan)
  image: ^4.1.7            # mengecilkan foto verifikasi

  # Local storage (remember-me / quick login / preferensi)
  get_storage: ^2.1.1
  # Penyimpanan terenkripsi (Keystore/Keychain) untuk password Login Cepat multi-akun
  flutter_secure_storage: ^9.2.2

  # Utilities
  pdf: ^3.10.8           # membuat PDF surat
  printing: ^5.12.0      # pratinjau / simpan / cetak PDF
  url_launcher: ^6.2.5   # buka WhatsApp / telepon (Pusat Bantuan)
  intl: ^0.20.2
  flutter_localizations: # ← tambah ini
    sdk: flutter
  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter_icons:
  android: true
  ios: true
  image_path: "assets/ic_launcher.png"

flutter:
  uses-material-design: true

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    - family: DMSerif
      fonts:
        - asset: assets/fonts/DMSerifDisplay-Regular.ttf
