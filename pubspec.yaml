name: talagasari_hub
description: Platform Komunitas Terpadu Desa Talagasari - Informasi Warga & Layanan Jasa Berbasis Lokasi.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase Core
  firebase_core: ^2.24.0
  firebase_auth: ^4.15.0
  cloud_firestore: ^4.13.0
  firebase_storage: ^11.5.0
  firebase_messaging: ^14.7.0

  # State Management
  get: ^4.6.6

  # Location & GPS
  geolocator: ^10.1.0
  permission_handler: ^11.1.0
  flutter_map: ^7.0.2      # peta OpenStreetMap (gratis, tanpa API key)
  latlong2: ^0.9.1

  # Image
  image_picker: ^1.0.5
  cached_network_image: ^3.3.0

  # Local storage (remember-me / quick login / preferensi)
  get_storage: ^2.1.1
  # Penyimpanan terenkripsi (Keystore/Keychain) untuk password Login Cepat multi-akun
  flutter_secure_storage: ^9.2.2

  # Utilities
  intl: ^0.20.2
  flutter_localizations: # ← tambah ini
    sdk: flutter
  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
